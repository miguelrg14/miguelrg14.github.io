    <main id="main">
        <section aria-labelledby="title">
            <h1 id="title">Art</h1>
            <p class="lead">Illustration, pixel art, 3D models and drawing, for games and for fun.</p>
        </section>

        <section aria-label="Gallery">
            <ul class="gallery">
            <li>
                <figure>
                    <button type="button" aria-label="Enlarge Illustration"><img src="../assets/art/cowboy-digital.webp" alt="Digital illustration of a green-skinned cowboy firing a revolver at sunset" width="1200" height="845" loading="lazy"></button>
                    <figcaption><strong>Illustration</strong>Drawn from scratch in Illustrator.</figcaption>
                </figure>
            </li>
            <li>
                <figure>
                    <button type="button" aria-label="Enlarge Digital painting"><img src="../assets/art/explorer.webp" alt="An explorer with goggles and a torch finding a chest in a cave" width="848" height="1200" loading="lazy"></button>
                    <figcaption><strong>Digital painting</strong>Painted in Photoshop.</figcaption>
                </figure>
            </li>
            <li class="pixel">
                <figure>
                    <button type="button" aria-label="Enlarge Isometric hospital"><img src="../assets/art/hospital-pixel-art.png" alt="Isometric pixel art of a hospital and its garden" width="1900" height="1300" loading="lazy"></button>
                    <figcaption><strong>Isometric hospital</strong>Pixel art.</figcaption>
                </figure>
            </li>
            <li>
                <figure>
                    <button type="button" aria-label="Enlarge Alcatraz, 3D model"><img src="../assets/art/alcatraz-1.webp" alt="3D model of Alcatraz, a long cell block" width="1200" height="700" loading="lazy"></button>
                    <figcaption><strong>Alcatraz, 3D model</strong>Modelled, unwrapped and textured for a low-poly scene.</figcaption>
                </figure>
            </li>
            <li class="pixel">
                <figure>
                    <button type="button" aria-label="Enlarge Zombie arcade"><img src="../assets/art/zombie-game.png" alt="Top-down pixel art scene of a zombie arcade game" width="560" height="880" loading="lazy"></button>
                    <figcaption><strong>Zombie arcade</strong>A pixel art arcade game about zombie hordes. I drew everything in it.</figcaption>
                </figure>
            </li>
            <li>
                <figure>
                    <button type="button" aria-label="Enlarge Alcatraz, inside"><img src="../assets/art/alcatraz-2.webp" alt="3D model of Alcatraz, cells on both sides of a corridor" width="1200" height="653" loading="lazy"></button>
                    <figcaption><strong>Alcatraz, inside</strong>Cells on both sides of the corridor.</figcaption>
                </figure>
            </li>
            <li>
                <figure>
                    <button type="button" aria-label="Enlarge Character sheet"><img src="../assets/art/cowboy-drawing.webp" alt="Watercolour character sheet of a cowboy" width="1200" height="900" loading="lazy"></button>
                    <figcaption><strong>Character sheet</strong>Watercolour on paper: a cowboy and the same cowboy running through a western town.</figcaption>
                </figure>
            </li>
            </ul>
