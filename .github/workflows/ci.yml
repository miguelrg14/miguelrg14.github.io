name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate
      - name: Check that every local link and asset exists
        run: |
          node -e '
          const fs = require("fs"), path = require("path");
          const files = require("child_process").execSync("git ls-files \"*.html\" data/projects.js").toString().trim().split("\n");
          let missing = 0;
          for (const f of files) {
            const text = fs.readFileSync(f, "utf8");
            const base = f.endsWith(".js") ? "" : path.dirname(f);
            for (const [, ref] of text.matchAll(/(?:href|src|image|video)\s*[=:]\s*"([^"#?]+)/g)) {
              if (/^(https?:|mailto:|\/)/.test(ref) || ref.includes("${")) continue;
              let target = path.join(base, ref);
              if (ref.endsWith("/")) target = path.join(target, "index.html");
              if (!fs.existsSync(target)) { console.log(`${f}: missing ${ref}`); missing++; }
            }
          }
          process.exit(missing ? 1 : 0);'
